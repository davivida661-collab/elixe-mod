name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar manualmente

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para calcular versão corretamente

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle # Cache automático do Gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Setup Forge dev workspace
        run: ./gradlew setupDecompWorkspace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3G -XX:MaxMetaspaceSize=512m"

      - name: Build mod jar
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3G -XX:MaxMetaspaceSize=512m"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elixe-mod-${{ github.run_number }}
          path: |
            build/libs/*.jar
            build/reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/test-results/**/*.xml
          check_name: Test Results

      - name: Build status notification
        if: failure()
        run: |
          echo "❌ Build failed! Check the logs above for details."
          exit 1

      - name: Build success notification
        if: success()
        run: |
          echo "✅ Build completed successfully!"
