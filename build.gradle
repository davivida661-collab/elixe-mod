buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://repo.spongepowered.org/maven/" }
        maven { url = "https://files.minecraftforge.net/maven" }
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

group = 'elixe'
archivesBaseName = 'elixe'
version = project.mod_version

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    options.encoding = 'UTF-8'
}

minecraft {
    version = project.forge_version
    runDir = 'run'
    mappings = project.mcp_mappings
    // makeObfSourceJar = false
}

configurations {
    embed
}

repositories {
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/maven/" }
    maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url = "https://files.minecraftforge.net/maven" }
    maven { url = "https://maven.minecraftforge.net/" }
}

dependencies {
    // SpongePowered Mixin - no classpath de compilação...
    compile('org.spongepowered:mixin:0.7.10-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
        exclude module: 'commons-lang'
    }
    // ...E embutido no jar final: Forge 1.8.9 não traz Mixin
    // (sem isso, MixinTweaker dá ClassNotFoundException no launcher)
    embed('org.spongepowered:mixin:0.7.10-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
        exclude module: 'commons-lang'
        exclude group: 'org.ow2.asm' // MC 1.8.9 já traz asm-all 5.0.3
    }

    // TypeTools - usado pelo event bus alpine (net.jodah.typetools.TypeResolver)
    compile 'net.jodah:typetools:0.6.3'
    embed 'net.jodah:typetools:0.6.3'
}

mixin {
    add sourceSets.main, "mixins.elixe.refmap.json"
    defaultObfuscationEnv notch
}

processResources {
    // Replace tokens in mcmod.info
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    // Embute Mixin + TypeTools no jar final (fat jar)
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/maven/**'

    manifest {
        attributes(
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'TweakOrder': 0,
            'MixinConfigs': 'mixins.elixe.json'
            // Sem FMLCorePlugin: em produção o MixinTweaker cuida de tudo.
            // O coremod (ElixeCoreMod) só é ativado no dev via -Dfml.coreMods.load.
        )
    }
}

// Dev runClient needs the coremod to bootstrap Mixin in the dev environment
runClient {
    jvmArgs = [
        '-Dfml.coreMods.load=elixe.core.ElixeCoreMod',
        '-Dmixin.debug=true'
    ]
}
